# Build an unsigned BitChord IPA for sideloading.
#
# The Apple app already exists in this repo (AppleApp/, XcodeGen project.yml,
# v1.0.4 build 13). This workflow builds the two frameworks the app links
# (Kotlin shared + Rust native core), generates the Xcode project, and runs
# the repo's own scripts/package-ios-ipa.sh, which archives with signing
# disabled and verifies the IPA is unsigned with no provisioning profile.
#
# No app code is changed here. The generated Xcode project and frameworks
# are build outputs and are gitignored.
name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/ios-unsigned-ipa.yml

jobs:
  build:
    name: Build BitChord (unsigned IPA)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          ls /Applications | grep -i xcode || true
          # The app weak-links MusicUnderstanding (iOS 26 SDK, project.yml:
          # `-weak_framework MusicUnderstanding` + the MusicUnderstanding
          # SDK dependency), so Xcode 16 cannot link it — Xcode 26 is
          # required. macos-15 ships 26.0.1-26.3 alongside 16.4.
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$XCODE" ]; then
            echo "No Xcode 26 found; falling back to newest Xcode 16"
            XCODE="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [ -n "$XCODE" ]; then
            echo "Selecting $XCODE"
            sudo xcode-select -s "$XCODE"
          fi
          xcodebuild -version
          xcode-select -p

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install XcodeGen and CMake
        run: brew install xcodegen cmake

      - name: Add Rust Apple targets
        run: rustup target add aarch64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim

      - name: Build shared framework (release)
        run: CONFIG=release ./scripts/build-shared-framework.sh

      - name: Build native core framework
        run: ./scripts/build-native-core.sh

      - name: Generate Xcode project
        run: xcodegen generate --spec AppleApp/project.yml

      - name: List project targets
        run: xcodebuild -list -project AppleApp/BitChord.xcodeproj

      - name: Package unsigned IPA
        run: |
          mkdir -p build/release
          set -o pipefail
          ./scripts/package-ios-ipa.sh 1.0.4 --output-dir build/release 2>&1 | tee build/release/package.log

      - name: Show package log tail on failure
        if: failure()
        run: |
          echo '## Package log (last 150 lines)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f build/release/package.log ]; then
            tail -n 150 build/release/package.log >> "$GITHUB_STEP_SUMMARY"
          else
            echo '(no package.log was produced)' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload package log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: package-log
          path: build/release/package.log
          retention-days: 7
          if-no-files-found: ignore

      - name: List IPA
        run: ls -lh build/release/

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-unsigned-ipa
          path: build/release/*.ipa
          retention-days: 30
